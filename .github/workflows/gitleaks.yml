name: gitleaks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ustal zakres commitow do przeskanowania
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "log_opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "log_opts=-1" >> "$GITHUB_OUTPUT"
            else
              echo "log_opts=$before..${{ github.sha }}" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Uruchom gitleaks (OSS, bez licencji)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source /repo -v --redact --log-opts="${{ steps.range.outputs.log_opts }}"
