name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Uruchom caly stack (docker compose)
        run: docker compose up -d --build

      - name: Czekaj az backend i frontend odpowiadaja
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          for i in $(seq 1 30); do curl -sf http://localhost:5173 > /dev/null && break; sleep 2; done

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instaluj zaleznosci frontendu
        working-directory: frontend
        run: npm ci

      - name: Instaluj przegladarke Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Uruchom test E2E
        working-directory: frontend
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:5173

      - name: Logi kontenerow (przy bledzie)
        if: failure()
        run: docker compose logs

      - name: Sprzatanie
        if: always()
        run: docker compose down -v
