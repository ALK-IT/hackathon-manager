name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Wygeneruj klucz szyfrowania dla E2E
        run: echo "RESOURCE_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"

      - name: Uruchom caly stack (docker compose)
        run: docker compose up -d --build

      - name: Czekaj az backend i frontend odpowiadaja
        run: |
          curl --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors --fail --silent --show-error http://localhost:8000/health
          curl --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors --fail --silent --show-error http://localhost:5173 > /dev/null
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instaluj zaleznosci frontendu
        working-directory: frontend
        run: npm ci

      - name: Instaluj przegladarke Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Uruchom caly stack (docker compose)
        run: docker compose -f docker-compose.yml up -d --build

      - name: Czekaj az backend i frontend odpowiadaja
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          for i in $(seq 1 30); do curl -sf http://localhost:5173 > /dev/null && break; sleep 2; done

      - name: Uruchom test E2E
        working-directory: frontend
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:8000

      - name: Logi kontenerow (przy bledzie)
        if: failure()
        run: docker compose -f docker-compose.yml logs

      - name: Sprzatanie
        if: always()
        run: docker compose -f docker-compose.yml down -v
