name: hackathon-manager-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hackathon_test
      POSTGRES_PASSWORD: hackathon_test
      POSTGRES_DB: hackathon_manager_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon_test -d hackathon_manager_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend-test:
    build: ./backend
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+asyncpg://hackathon_test:hackathon_test@postgres-test:5432/hackathon_manager_test
      TEST_DATABASE_URL: postgresql+asyncpg://hackathon_test:hackathon_test@postgres-test:5432/hackathon_manager_test
      REDIS_URL: redis://redis-test:6379/0
      JWT_SECRET_KEY: test-secret-key-with-at-least-32-characters
    volumes:
      - ./backend:/app
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: pytest

  redis-test:
    image: redis:7-alpine
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
